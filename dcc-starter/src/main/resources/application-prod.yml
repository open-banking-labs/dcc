spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_HOST_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    show-sql: false
  flyway:
    clean-disabled: true
    placeholders:
      env_tag: "prod"
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_HOST_PORT}
      password: ${REDIS_PASSWORD}
