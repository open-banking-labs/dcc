server:
  port: 8081

spring:
  application:
    name: dcc-mcp
  jpa:
    hibernate:
      ddl-auto: validate
  # Flyway is owned by dcc-web / the deployment. dcc-bootstrap puts Flyway on
  # the classpath, but this application never migrates the schema, so it is
  # disabled here and only validates (ddl-auto: validate above).
  flyway:
    enabled: false
  ai:
    mcp:
      server:
        name: dcc-mcp
        version: 0.0.1
        # Streamable HTTP transport, served by the webmvc layer on the port above.
        protocol: streamable
        streamable-http:
          mcp-endpoint: /mcp
        instructions: >-
          DCC (Data Contract Center) exposes data-model metadata. Use these tools
          to read model definitions and to generate code/SQL from the central
          model definition.

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Shared security: verify the caller's bearer JWT (see dcc-security).
dcc:
  # Code/SQL generation (dcc-generator). See docs/templating.md and docs/configuration.md.
  database:
    dialect: postgresql                    # selects the TypeMappingStrategy
  generator:
    template-dir: classpath:/templates/    # override with file:/path/to/custom/
  # type-mapping:                          # optional type overrides (upper-cased logical types)
  #   dialects:
  #     postgresql:
  #       DATETIME: TIMESTAMP
  mcp:
    prompts:
      dir: classpath:/mcp/prompts/         # override with file:/etc/dcc/prompts/
      default-locale: en
  security:
    jwt-secret: ${DCC_JWT_SECRET:dev-only-change-me-please-use-32-bytes}
