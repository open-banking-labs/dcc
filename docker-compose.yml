services:
  # ========================================
  # Core: PostgreSQL (required)
  # ========================================
  postgres:
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    container_name: ${PROJECT_NAME:-dcc}-postgres-${ENV:-dev}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dcc_dev}
      POSTGRES_USER: ${POSTGRES_USER:-dcc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - dcc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcc_user} -d ${POSTGRES_DB:-dcc_dev}"]
      interval: ${HEALTHCHECK_INTERVAL:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}
    restart: ${RESTART_POLICY:-unless-stopped}
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-512M}
        reservations:
          memory: ${POSTGRES_MEMORY_RESERVATION:-256M}
    labels:
      - "dcc.component=db"
      - "dcc.environment=${ENV:-dev}"

  # ========================================
  # Optional: Redis
  # ========================================
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: ${PROJECT_NAME:-dcc}-redis-${ENV:-dev}
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} 
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --appendonly yes
      --appendfsync everysec
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - dcc-network
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: ${HEALTHCHECK_INTERVAL:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}
    restart: ${RESTART_POLICY:-unless-stopped}
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256M}
    profiles:
      - redis
      - full
    labels:
      - "dcc.component=cache"
      - "dcc.environment=${ENV:-dev}"

  # ========================================
  # Optional: RabbitMQ
  # ========================================
  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION:-4-management-alpine}
    container_name: ${PROJECT_NAME:-dcc}-rabbitmq-${ENV:-dev}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/dcc}
    ports:
      - "${RABBITMQ_AMQP_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq-definitions:/etc/rabbitmq/definitions:ro
    networks:
      - dcc-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: ${HEALTHCHECK_INTERVAL:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}
    restart: ${RESTART_POLICY:-unless-stopped}
    deploy:
      resources:
        limits:
          memory: ${RABBITMQ_MEMORY_LIMIT:-512M}
    profiles:
      - rabbitmq
      - full
    labels:
      - "dcc.component=message"
      - "dcc.environment=${ENV:-dev}"

  # ========================================
  # Optional: MinIO
  # ========================================
  minio:
    image: minio/minio:${MINIO_VERSION:-latest}
    container_name: ${PROJECT_NAME:-dcc}-minio-${ENV:-dev}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-http://localhost:9090}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9090}:9090"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9090"
    networks:
      - dcc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-20s}
      retries: ${HEALTHCHECK_RETRIES:-3}
    restart: ${RESTART_POLICY:-unless-stopped}
    deploy:
      resources:
        limits:
          memory: ${MINIO_MEMORY_LIMIT:-1G}
    profiles:
      - minio
      - full
    labels:
      - "dcc.component=storage"
      - "dcc.environment=${ENV:-dev}"

  # ========================================
  # Optional: Adminer (database management)
  # ========================================
  adminer:
    image: adminer:${ADMINER_VERSION:-latest}
    container_name: ${PROJECT_NAME:-dcc}-adminer-${ENV:-dev}
    ports:
      - "${ADMINER_HOST_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: ${ADMINER_THEME:-dracula}
      ADMINER_PLUGINS: tables-filter,theme-edit
    networks:
      - dcc-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: ${RESTART_POLICY:-unless-stopped}
    profiles:
      - adminer
      - full
    labels:
      - "dcc.component=admin"
      - "dcc.environment=${ENV:-dev}"

networks:
  dcc-network:
    driver: bridge
    name: ${PROJECT_NAME:-dcc}-network-${ENV:-dev}

volumes:
  postgres_data:
    name: ${PROJECT_NAME:-dcc}-postgres-data-${ENV:-dev}
  redis_data:
    name: ${PROJECT_NAME:-dcc}-redis-data-${ENV:-dev}
  rabbitmq_data:
    name: ${PROJECT_NAME:-dcc}-rabbitmq-data-${ENV:-dev}
  minio_data:
    name: ${PROJECT_NAME:-dcc}-minio-data-${ENV:-dev}