server:
  port: 8080

spring:
  servlet:
    multipart:
      # Excel imports carry a whole standards sheet; the service caps rows separately.
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/ddl,classpath:db/migration/dml,classpath:db/migration/function,classpath:db/migration/index
    encoding: UTF-8
    sql-migration-separator: __
    sql-migration-prefix: V
    sql-migration-suffixes: .sql
    baseline-version: 20260901000000
    baseline-on-migrate: true
    out-of-order: false
    table: flyway_schema_history
    validate-on-migrate: true
    connect-retries: 3
    connect-retries-interval: 5
    placeholders:
      tenant_id: "default_tenant"
      sys_operator: "system"
    placeholder-prefix: "${"
    placeholder-suffix: "}"
    skip-default-callbacks: false
    init-sqls:
      - SET SESSION lock_timeout = '2s';
      - SET SESSION idle_session_timeout = '600s';

# Application warm-up (see docs/modules/dcc-web.md)
dcc:
  # Path version for the /cli/<version> command API (dcc-cli must match via DCC_API_VERSION).
  api:
    version: v1
  # Asynchronous Excel export (see docs/configuration.md). dcc-web is the only
  # application that consumes the queue; dcc-mcp leaves worker-enabled off.
  export:
    worker-enabled: true
    worker-delay-ms: 2000
    presign-ttl: PT10M
    retention: PT24H
    max-rows: 50000
    max-selected: 100
    import-max-rows: 2000
    s3:
      endpoint: ${DCC_EXPORT_S3_ENDPOINT:http://localhost:9000}
      region: ${DCC_EXPORT_S3_REGION:us-east-1}
      access-key: ${DCC_EXPORT_S3_ACCESS_KEY:${MINIO_ROOT_USER:minioadmin}}
      secret-key: ${DCC_EXPORT_S3_SECRET_KEY:${MINIO_ROOT_PASSWORD:}}
      bucket: ${DCC_EXPORT_S3_BUCKET:dcc-exports}
      path-style: ${DCC_EXPORT_S3_PATH_STYLE:true}
  # Tenant model defaults (see docs/configuration.md).
  tenant:
    default-tenant: default_tenant
    system-operator: system
    isolation: ROW
    enforce-tenant-status: true           # use cases reject tenants that are disabled/deleted
  # Code/SQL generation (dcc-generator). See docs/templating.md and docs/configuration.md.
  database:
    dialect: postgresql                    # selects the TypeMappingStrategy
  generator:
    template-dir: classpath:/templates/    # override with file:/path/to/custom/
  # type-mapping:                          # optional type overrides (upper-cased logical types)
  #   dialects:
  #     postgresql:
  #       DATETIME: TIMESTAMP
  # Audit trail (see docs/decisions/0002-retention-and-audit-trail.md).
  audit:
    retention-years: 7    # cutoff frozen on every entry (audit_log.retention_until)
    sweep-enabled: false  # scheduled report of entries past cutoff (report-only, no purge)
    sweep-cron: "0 0 3 * * *"
  warmup:
    enabled: true     # run the warm-up at all
    async: false      # run off the startup thread
    fail-fast: true   # true = shut down and exit on failure, false = ignore
    steps:            # ordered WarmupTask names; add "warmup-redis" once Redis is running
      - warmup-hikari
      - warmup-jvm-cache
  security:
    # HS256 secret used to verify bearer tokens when no JWKS is configured.
    # Override (via DCC_JWT_SECRET) outside dev, or set dcc.security.jwk-set-uri
    # to verify asymmetric tokens from your identity provider.
    jwt-secret: ${DCC_JWT_SECRET:dev-only-change-me-please-use-32-bytes}
    # Directory-backed identity governance (dcc.security.directory-mode): the token is
    # only an identity; tenant access requires a membership row and directory-assigned
    # roles are unioned with claim roles. Bootstrap the first admin through
    # /api/directory/* before switching it on (see docs/configuration.md).
    directory-mode: false

# Redis is an optional integration; keep it out of the overall /actuator/health
# until it becomes a required dependency (then flip this to true).
management:
  health:
    redis:
      enabled: false
